name: Build and publish AppStat

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appstat-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-site.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-site.txt
          python -m playwright install --with-deps chromium
      - name: Export notebooks and bundle marimo
        run: |
          python -m marimo check ktvd/ColorLab/interactive/experiments.py
          python scripts/build_site.py --offline
          python scripts/check_site.py
      - name: Upload build for review
        uses: actions/upload-artifact@v4
        with:
          name: appstat-preview
          path: dist/
          include-hidden-files: true
      - name: Prepare GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment

