title: Прикладная статистика
author: Эмиль Кайралиев, Торхова Кристина
only_build_toc_files: true

execute:
  execute_notebooks: "off"

repository:
  url: https://github.com/ekairaliev/AppStat-Lab01
  branch: main

html:
  baseurl: https://ekairaliev.github.io/AppStat-Lab01/
  use_repository_button: true
  use_issues_button: false
  use_edit_page_button: false
  home_page_in_navbar: true
  extra_footer: '<a href="https://colab.research.google.com/github/ekairaliev/AppStat-Lab01/blob/main/AppStat_Lab01.ipynb">Открыть полный ноутбук в Colab</a>'

parse:
  myst_enable_extensions:
    - dollarmath
    - amsmath
    - colon_fence
    - deflist

sphinx:
  recursive_update: true
  config:
    language: ru
    html_show_copyright: false
    templates_path:
      - _templates
    html_title: Прикладная статистика
    html_css_files:
      - custom.css
    html_theme_options:
      navigation_with_keys: true
      show_toc_level: 2
      logo:
        text: "AppStat · Лабораторная № 1"
      pygments_light_style: friendly
      pygments_dark_style: monokai
    nb_execution_show_tb: false
